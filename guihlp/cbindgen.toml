    "CFieldValueData",
    "CFieldValueMap",
    "CFieldValueMapEntry",
    "CFieldValueArray",
    "FfiResult",
    "FfiOption",
    "FfiArray",
    "FfiResult_i32",
    "FfiResult_f32",
    "FfiResult_bool",
    "FfiResult_void",
    "FfiResult_CFieldValue",
    "FfiResult_TimelineId",
    "FfiResult_ClipId",
    "FfiResult_Option_CFieldValue",
