cpp_compat = true
language = "C++"
namespace = "esotereel_gui_helper"
pragma_once = true
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify manually. */"
sys_includes = ["QVector3D", "QMatrix4x4", "cstdint"]

[parse]
parse_deps = true
clean = true
include = ["esotereel_lib"]


[export.rename]
"Vec3" = "QVector3D"
"Mat4" = "QMatrix4x4"

[export]
include = [
    "TimelineId",
    "ClipId",
    "LayerId",
    "ScriptId",
    "Clip",
    "Project",
    "Timeline",
]
