name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: build/target

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to ubuntu-22.04 (glibc 2.35): linuxdeployqt aborts on
          # hosts with glibc >= 2.36 unless glibc is fully bundled into the
          # AppDir. See installer/linux/build_appimage.sh for details.
          - os: ubuntu-22.04
            qt_arch: ""
            rust_target: ""
            arch: "x86_64"
            appimage: true
            dist: "error"
          - os: windows-latest
            qt_arch: "win64_msvc2022_64"
            rust_target: "x86_64-pc-windows-msvc"
            arch: "x86_64"
            ffmpeg_arch: "win64"
            msvc_arch: "x64"
            qt_kit: "qt6_6120_msvc2022_64"
            qt_pkg: "win64_msvc2022_64"
            qt_dir: "msvc2022_64"
            dist: "error"
          # macos-14 runners were retired by GitHub (jobs fail to start with
          # "The configuration 'macos-14-arm64-us-default' is not supported"),
          # so the macOS job follows macos-latest. Qt is unified on 6.12:
          # 6.8 fails to link the Qt docking library on the macos-latest
          # SDK because the AGL framework was removed
          # ("ld: framework 'AGL' not found").
          - os: macos-latest
            qt_arch: "clang_64"
            rust_target: ""
            arch: "arm64"
            dist: "error"
          # Intel Mac build on the native x86_64 runner. The Qt package
          # (clang_64) is universal, and the artifact name differs from
          # the arm64 job via matrix.os.
          - os: macos-15-intel
            qt_arch: "clang_64"
            rust_target: ""
            arch: "x86_64"
            dist: "error"
          # Linux ARM (aarch64). Pinned to ubuntu-24.04-arm: there is no
          # 22.04 ARM runner image. AppImage packaging is skipped on this
          # job: linuxdeployqt and appimagetool are only distributed as
          # x86_64 AppImages, and linuxdeployqt also refuses hosts with
          # glibc >= 2.36 (24.04 ships a newer glibc). The job covers
          # build + tests + a launch smoke test of the raw binary.
          - os: ubuntu-24.04-arm
            qt_arch: ""
            rust_target: ""
            arch: "aarch64"
            appimage: false
            dist: "warn"
          # Windows ARM64 on the native ARM runner. Qt ships an ARM64
          # MSVC 2022 kit and BtbN publishes winarm64 FFmpeg builds, so
          # the same flow as the x86_64 Windows job applies.
          - os: windows-11-arm
            qt_arch: "win64_msvc2022_arm64"
            rust_target: "aarch64-pc-windows-msvc"
            arch: "arm64"
            ffmpeg_arch: "winarm64"
            msvc_arch: "arm64"
            qt_kit: "qt6_6120_msvc2022_arm64_cross_compiled"
            qt_pkg: "win64_msvc2022_arm64_cross_compiled"
            qt_dir: "msvc2022_arm64"
            dist: "error"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Qt6
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.*"
          arch: ${{ matrix.qt_arch }}
          cache: true

      # Windows jobs cannot use install-qt-action: since Qt 6.11 the
      # Windows repository uses per-kit directories
      # (qt6_6120/qt6_6120_msvc2022_64/...) and aqt still looks for
      # qt6_6120/qt6_6120/Updates.xml, which no longer exists, so the
      # install fails with "Failed to locate XML data". Download the
      # component archives listed in the kit's Updates.xml directly
      # instead. qtdoc/qtdeclarative archives are skipped: the build
      # only needs qtbase/qttools (plus the runtime helpers below).
      - name: Install Qt6 (Windows, direct download)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '6.12.0'
          $kit = '${{ matrix.qt_kit }}'
          $pkg = "qt.qt6.6120.${{ matrix.qt_pkg }}"
          $repo = "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6120/$kit"
          $dest = Join-Path $env:GITHUB_WORKSPACE "Qt\$version\${{ matrix.qt_dir }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          [xml]$updates = (Invoke-WebRequest -Uri "$repo/Updates.xml" -UseBasicParsing).Content
          $node = $updates.Updates.PackageUpdate | Where-Object { $_.Name -eq $pkg } | Select-Object -First 1
          if (-not $node) { throw "package $pkg not found in $repo/Updates.xml" }
          $archives = ($node.DownloadableArchives -split ',\s*') | Where-Object { $_ -match '^(qtbase|qtsvg|qttools|qttranslations|d3dcompiler|opengl32sw)' }
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { $sevenZip = (Get-Command 7z.exe).Source }
          foreach ($a in $archives) {
            $url = "$repo/$pkg/$($node.Version)$a"
            $file = Join-Path $env:RUNNER_TEMP $a
            Write-Host "Downloading $url"
            curl.exe -L --fail -o $file $url
            if ($LASTEXITCODE -ne 0) { throw "download failed: $url" }
            & $sevenZip x $file "-o$dest" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "extract failed: $a" }
          }
          echo "QT_ROOT_DIR=$dest" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$dest" >> $env:GITHUB_ENV
          echo "$dest\bin" >> $env:GITHUB_PATH

      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install ninja
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install ninja
          fi
        shell: bash

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libwayland-dev \
            libgl1-mesa-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev

      - name: Install linuxdeployqt (Linux)
        if: runner.os == 'Linux' && matrix.appimage
        run: |
          sudo wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O /usr/local/bin/linuxdeployqt
          sudo chmod +x /usr/local/bin/linuxdeployqt

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux' && matrix.appimage
        run: |
          sudo wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install FFmpeg dev libs (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      - name: Install FFmpeg dev libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-${{ matrix.ffmpeg_arch }}-lgpl-shared-9.0.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath C:\ffmpeg
          $dir = Get-ChildItem C:\ffmpeg | Select-Object -First 1
          echo "FFMPEG_DIR=$($dir.FullName)" >> $env:GITHUB_ENV
          echo "$($dir.FullName)\bin" >> $env:GITHUB_PATH

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          echo $nsis
          echo "$nsis" >> $env:GITHUB_PATH
          & "$nsis\makensis.exe" /VERSION
    
      - name: Debug DLL paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          where.exe qmake
          where.exe Qt6Core.dll
          where.exe ffmpeg
          $env:PATH -split ';' | Select-String 'Qt|FFmpeg|ffmpeg'

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/cmake/_deps
          key: ${{ runner.os }}-${{ matrix.arch }}-ads-5.0.0

      # The FFI header generated by cbindgen declares extern "C" functions
      # returning the C++ template type FfiResult<T>. MSVC's conformance
      # mode rejects that with error C2526, while clang accepts it, and the
      # generic Result type is kept intentionally for readability. Build
      # the Windows job with clang-cl (MSVC-compatible clang driver) so
      # the same FFI design compiles without /permissive workarounds,
      # which Qt 6 forbids via a static_assert.
      - name: Select clang-cl compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "CC=clang-cl" >> $env:GITHUB_ENV
          echo "CXX=clang-cl" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/cmake --config Release --parallel

      - name: Run Rust tests
        run: cargo test --workspace --release

      # ========== パッケージ化ステップ ==========
      # The installer scripts locate objdump.exe via PATH, but the
      # MinGW objdump available on the ARM64 runner cannot read ARM64
      # PE files, so build_installer.ps1 fails at its first inspection.
      # Shim objdump.exe to llvm-objdump (same -p "DLL Name:" output)
      # ahead of it in PATH for this job only.
      - name: Shim objdump to llvm-objdump (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $llvmObjdump = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\ARM64\bin\llvm-objdump.exe' | Select-Object -First 1
          if (-not $llvmObjdump) { throw 'llvm-objdump.exe not found in the VS LLVM ARM64 toolchain' }
          $shim = Join-Path $env:RUNNER_TEMP 'objdump-shim'
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          Copy-Item $llvmObjdump.FullName (Join-Path $shim 'objdump.exe')
          echo $shim >> $env:GITHUB_PATH

      - name: Package Windows Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\installer\windows\build_installer.ps1

      # Launch smoke test (Windows): the staged win_dist layout is what
      # the installer ships, so launch the exe from there.
      - name: Smoke test Windows app launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build\win_dist\esotereel_gui.exe"
          $log = Join-Path $env:RUNNER_TEMP "esotereel-smoke.log"
          $err = Join-Path $env:RUNNER_TEMP "esotereel-smoke.err.log"
          $p = Start-Process -FilePath $exe -WorkingDirectory "build\win_dist" -PassThru -RedirectStandardOutput $log -RedirectStandardError $err
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "::error::esotereel_gui exited within 15s (code $($p.ExitCode))"
            if (Test-Path $log) { Get-Content $log }
            if (Test-Path $err) { Get-Content $err }
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "smoke OK: alive after 15s"

      - name: Package Linux AppImage
        if: runner.os == 'Linux' && matrix.appimage
        run: bash installer/linux/build_appimage.sh

      # Launch smoke test (Linux): run the packaged AppImage headlessly
      # under Xvfb. --appimage-extract-and-run avoids needing FUSE.
      - name: Smoke test Linux app launch
        if: runner.os == 'Linux' && matrix.appimage
        run: |
          set -u
          LOG="$RUNNER_TEMP/esotereel-smoke.log"
          sudo apt-get install -y xvfb
          xvfb-run -a dist/esotereel.AppImage --appimage-extract-and-run >"$LOG" 2>&1 &
          PID=$!
          sleep 15
          if ! kill -0 "$PID" 2>/dev/null; then
            CODE=0
            wait "$PID" || CODE=$?
            echo "::error::esotereel exited within 15s (code $CODE)"
            cat "$LOG"
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          pkill -f esotereel 2>/dev/null || true
          echo "smoke OK: alive after 15s"

      # Launch smoke test (Linux, no AppImage): jobs without AppImage
      # packaging (ARM) smoke-test the build-tree binary directly. The
      # GUI helper library is not installed anywhere, so point
      # LD_LIBRARY_PATH at the Rust build output.
      - name: Smoke test Linux app launch (unpacked binary)
        if: runner.os == 'Linux' && !matrix.appimage
        run: |
          set -u
          LOG="$RUNNER_TEMP/esotereel-smoke.log"
          sudo apt-get install -y xvfb
          export LD_LIBRARY_PATH="$PWD/build/target/release${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          xvfb-run -a build/cmake/esotereel_gui >"$LOG" 2>&1 &
          PID=$!
          sleep 15
          if ! kill -0 "$PID" 2>/dev/null; then
            CODE=0
            wait "$PID" || CODE=$?
            echo "::error::esotereel_gui exited within 15s (code $CODE)"
            cat "$LOG"
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          pkill -f esotereel 2>/dev/null || true
          echo "smoke OK: alive after 15s"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: bash installer/macos/build_dmg.sh

      # Launch smoke test: the packaged .app must stay alive for 15s.
      # Catches launch-path crashes (dylib load failures, plugin load
      # panics, MainWindow construction) that build+test cannot see.
      # Post-launch interaction crashes and launch deadlocks (process
      # stays alive) are out of scope for this step.
      - name: Smoke test macOS app launch
        if: runner.os == 'macOS'
        run: |
          set -u
          APP="build/macOS/Esotereel.app/Contents/MacOS/esotereel_gui"
          LOG="$RUNNER_TEMP/esotereel-smoke.log"
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          ls "$CRASH_DIR" > "$RUNNER_TEMP/crash-before.txt" 2>/dev/null || true

          "$APP" >"$LOG" 2>&1 &
          PID=$!
          sleep 15

          if ! kill -0 "$PID" 2>/dev/null; then
            CODE=0
            wait "$PID" || CODE=$?
            echo "::error::esotereel_gui exited within 15s (code $CODE)"
            cat "$LOG"
            exit 1
          fi

          screencapture -x "$RUNNER_TEMP/esotereel-smoke.png" || true
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          # Fail if a new crash report for the app appeared during launch
          NEW=$(comm -13 <(sort "$RUNNER_TEMP/crash-before.txt") \
                         <(ls "$CRASH_DIR" 2>/dev/null | sort) \
                 | grep -i esotereel || true)
          if [ -n "$NEW" ]; then
            echo "::error::crash report generated: $NEW"
            exit 1
          fi
          echo "smoke OK: alive after 15s, no crash report"

      - name: Upload smoke log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: esotereel-${{ matrix.os }}-smoke-log
          path: |
            ${{ runner.temp }}/esotereel-smoke.log
            ${{ runner.temp }}/esotereel-smoke.err.log
            ${{ runner.temp }}/esotereel-smoke.png
          if-no-files-found: ignore

      # ========== Artifact Upload ==========
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esotereel-${{ matrix.os }}-dist
          path: dist/*
          if-no-files-found: ${{ matrix.dist }}
