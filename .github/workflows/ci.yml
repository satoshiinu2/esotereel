name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_arch: ""
          - os: windows-latest
            qt_arch: "win64_msvc2022_64"
          - os: macos-latest
            qt_arch: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      # target/ と ~/.cargo を自動でキャッシュしてくれる
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # jurplel action が Qt6_DIR を自動で環境変数にセットする
      # -> CMakeLists.txt の ENV{Qt6_DIR} 分岐がそのまま効く
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install ninja
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install ninja
          fi
        shell: bash

      # Qt6 Widgets + ADS(Wayland対応) のビルド/実行に必要な XCB/Wayland 系
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libwayland-dev \
            libgl1-mesa-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev

      # macOS: ffmpeg-sys-next のビルド時依存
      - name: Install FFmpeg dev libs (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      # Windows: ffmpeg-sys-next のビルド時依存(dev用シェアードビルド)
      # 実行時同梱するBtbNバイナリとは別に、ビルド時のヘッダ/import libが要る
      - name: Install FFmpeg dev libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "n7.1-latest"  # BtbN の固定タグ(rolling "latest" ではなく特定タグ)
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath C:\ffmpeg
          $dir = Get-ChildItem C:\ffmpeg | Select-Object -First 1
          echo "FFMPEG_DIR=$($dir.FullName)" >> $env:GITHUB_ENV

      # ADS(Qt-Advanced-Docking-System) の FetchContent clone をキャッシュ
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-ads-5.0.0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Rust tests
        run: cargo test --workspace --release

      # ========== Windows NSIS インストーラー ==========
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Create NSIS installer script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsiContent = @"
          !include "MUI2.nsh"
          !include "LogicLib.nsh"
          
          Name "Esotereel"
          OutFile "esotereel-installer.exe"
          InstallDir "`$PROGRAMFILES\Esotereel"
          InstallDirRegKey HKCU "Software\Esotereel" ""
          
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          
          Section "Install"
            SetOutPath "`$INSTDIR"
            
            ; Copy application files
            File "build\esotereel_gui.exe"
            `$`{If`} `$`{FileExists`} "target\release\esotereel_core.dll"
              File "target\release\esotereel_core.dll"
            `$`{EndIf`}
            
            ; Store install folder
            WriteRegStr HKCU "Software\Esotereel" "" "`$INSTDIR"
            
            ; Create uninstaller
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
            
            ; Create Start Menu shortcuts
            CreateDirectory "`$SMPROGRAMS\Esotereel"
            CreateShortCut "`$SMPROGRAMS\Esotereel\Esotereel.lnk" "`$INSTDIR\esotereel_gui.exe"
            CreateShortCut "`$SMPROGRAMS\Esotereel\Uninstall.lnk" "`$INSTDIR\Uninstall.exe"
            
            ; Create Desktop shortcut
            CreateShortCut "`$DESKTOP\Esotereel.lnk" "`$INSTDIR\esotereel_gui.exe"
          SectionEnd
          
          Section "Uninstall"
            Delete "`$INSTDIR\esotereel_gui.exe"
            Delete "`$INSTDIR\esotereel_core.dll"
            Delete "`$INSTDIR\Uninstall.exe"
            RMDir "`$INSTDIR"
            
            Delete "`$SMPROGRAMS\Esotereel\Esotereel.lnk"
            Delete "`$SMPROGRAMS\Esotereel\Uninstall.lnk"
            RMDir "`$SMPROGRAMS\Esotereel"
            
            Delete "`$DESKTOP\Esotereel.lnk"
            
            DeleteRegKey HKCU "Software\Esotereel"
          SectionEnd
          "@
          
          $nsiContent | Out-File -Encoding ASCII installer.nsi
          makensis.exe installer.nsi
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NSIS compiler failed"
            exit 1
          }

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: esotereel-windows-installer
          path: esotereel-installer.exe
          if-no-files-found: warn

      # ========== macOS DMG パッケージ ==========
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          set -e
          
          # AppBundleディレクトリ構造を作成
          mkdir -p esotereel.app/Contents/MacOS
          mkdir -p esotereel.app/Contents/Resources
          
          # 実行ファイルをコピー
          cp build/esotereel_gui esotereel.app/Contents/MacOS/esotereel_gui
          chmod +x esotereel.app/Contents/MacOS/esotereel_gui
          
          # 動的ライブラリをコピー（存在する場合）
          if [ -f target/release/libesotereel_core.dylib ]; then
            cp target/release/libesotereel_core.dylib esotereel.app/Contents/MacOS/
          fi
          
          # Info.plistを作成
          cat > esotereel.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>esotereel_gui</string>
              <key>CFBundleIdentifier</key>
              <string>com.esotereel.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Esotereel</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.12</string>
          </dict>
          </plist>
          PLIST
          
          # DMGを作成
          hdiutil create -volname "Esotereel" -srcfolder . -ov -format UDZO esotereel.dmg
          
          # 作成確認
          if [ -f esotereel.dmg ]; then
            echo "DMG created successfully"
            ls -lh esotereel.dmg
          else
            echo "Failed to create DMG"
            exit 1
          fi

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: esotereel-macos-dmg
          path: esotereel.dmg
          if-no-files-found: warn

      # ========== Linux AppImage ==========
      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        run: |
          set -e
          
          # appimagetoolのダウンロード
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          
          # AppImageディレクトリ構造を作成
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # 実行ファイルをコピー
          cp build/esotereel_gui AppDir/usr/bin/esotereel
          chmod +x AppDir/usr/bin/esotereel
          
          # 共有ライブラリをコピー（存在する場合）
          if [ -f target/release/libesotereel_core.so ]; then
            cp target/release/libesotereel_core.so AppDir/usr/lib/
          fi
          
          # .desktop ファイルを作成（AppImageメタデータ）
          cat > AppDir/usr/share/applications/esotereel.desktop << 'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Esotereel
          Exec=esotereel
          Icon=esotereel
          Categories=Utility;
          DESKTOP
          
          # AppImageのAppRun スクリプト
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE="${SELF%/*}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/esotereel" "$@"
          APPRUN
          chmod +x AppDir/AppRun
          
          # AppImageを作成
          ./appimagetool -n AppDir esotereel.AppImage
          
          # 作成確認
          if [ -f esotereel.AppImage ]; then
            echo "AppImage created successfully"
            ls -lh esotereel.AppImage
            chmod +x esotereel.AppImage
          else
            echo "Failed to create AppImage"
            exit 1
          fi

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: esotereel-linux-appimage
          path: esotereel.AppImage
          if-no-files-found: warn

      # ========== ビルド成果物アップロード ==========
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esotereel-${{ matrix.os }}
          path: |
            build/esotereel_gui*
            target/release/esotereel_core*
          if-no-files-found: warn
