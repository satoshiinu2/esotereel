[package]
name = "esotereel_lib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0"
bytemuck = "1.25"
log = "0.4"
colored = "3.0"
pollster = "0.4"
raw-window-handle = "0.6"
rkyv = { version = "0.7", features = ["validation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "29"
ffmpeg-next = "9.0"
image = "0.25"
dashmap = "6.1"
getset = "0.1"
glam = { version = "0.32", features = ["bytemuck"] }
ordered-float = "5"
tokio = "1.53.1"
